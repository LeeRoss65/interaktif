      background-image: url('bg1.jpg');

      justify-content: center;

      height: 100vh;
      margin: 0;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 180px);
      gap: 20px;
    }

    .icon-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .icon-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    }

    .icon-box a {
      text-decoration: none;
      color: #333;
      display: block;
    }

    .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .label {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
