        const totalItems = 4;
        let solvedItems = 0;

        function setBanner(text, type) {
            let banner = document.getElementById("feedback-banner");
            banner.textContent = text;
            banner.className = "feedback-" + type;
        }

        function initGame() {
            let pool = document.getElementById("item-pool");
            let grid = document.getElementById("categories-grid");
            pool.innerHTML = "";
            grid.innerHTML = "";

            let allItems = [];
            activityData.forEach(cat => allItems = allItems.concat(cat.items));
            allItems.sort(() => Math.random() - 0.5);

            allItems.forEach(item => {
                let el = document.createElement("div");
                el.className = "draggable-item";
                el.id = item.id;
                el.draggable = true;
                el.dataset.catIdx = item.catIdx;

                if (item.type === "text") {
                    el.textContent = item.content;
                } else {
                    let img = document.createElement("img");
                    img.src = item.content;
                    el.appendChild(img);
                }

                el.addEventListener("dragstart", e => {
                    e.dataTransfer.setData("text/plain", item.id);
                });

                pool.appendChild(el);
            });

            activityData.forEach((cat, idx) => {
                let box = document.createElement("div");
                box.className = "category-box";

                let header = document.createElement("div");
                header.className = "category-header";
                header.textContent = cat.name;

                let content = document.createElement("div");
                content.className = "category-content";

                box.appendChild(header);
                box.appendChild(content);

                box.addEventListener("dragover", e => {
                    e.preventDefault();
                    box.classList.add("drag-over");
                });
                box.addEventListener("dragleave", () => box.classList.remove("drag-over"));

                box.addEventListener("drop", e => {
                    e.preventDefault();
                    box.classList.remove("drag-over");
                    let id = e.dataTransfer.getData("text/plain");
                    let itemEl = document.getElementById(id);

                    if (!itemEl || itemEl.classList.contains("sorted-item")) return;

                    let correctIdx = parseInt(itemEl.dataset.catIdx);

                    if (correctIdx === idx) {
                        itemEl.classList.add("sorted-item");
                        itemEl.draggable = false;
                        content.appendChild(itemEl);
                        solvedItems++;

                        if (solvedItems === totalItems) {
                            setBanner("🎉 Awesome! You sorted all items correctly!", "success");
                        } else {
                            setBanner("✅ Correct! Placed into \"" + cat.name + "\".", "success");
                        }
                    } else {
                        setBanner("❌ Incorrect! That item does not belong in \"" + cat.name + "\". Try again!", "error");
                    }
                });

                grid.appendChild(box);
            });
        }

        initGame();
    </script>
