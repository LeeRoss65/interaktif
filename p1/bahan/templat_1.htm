<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permainan Pemadanan - Kata seerti</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
      background-image: ur('bg1.jpg');
    }

    h1, #result { text-align: center; }

    .name-entry {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 24px 0;
    }

    input, button { font: inherit; }

    input {
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 6px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #245dcc;
      color: white;
      cursor: pointer;
    }

    button:disabled { cursor: default; opacity: .55; }

    #game { display: none; }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 20px;
    }

    .column { display: grid; gap: 10px; }

    .item {
      min-height: 48px;
      background: #f1f4f9;
      color: #222;
      border: 2px solid transparent;
    }

    .item.selected {
      border-color: #245dcc;
      background: #e3ecff;
    }

    .item.matched {
      background: #d9f3df;
      color: #285b31;
    }

    #status { min-height: 1.5em; text-align: center; }
    #result { font-size: 1.3rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Padankan pasangan yang betul</h1>

  <form class="name-entry" id="nameForm">
    <input id="playerName" type="text" placeholder="Nama kamu" required>
    <button type="submit">Mula</button>
  </form>

  <section id="game" aria-label="Pemadanan">
    <p id="welcome"></p>
    <p id="status" aria-live="polite">Pilih dan padankan.</p>
    <div class="columns">
      <div class="column" id="leftColumn" aria-label="First column"></div>
      <div class="column" id="rightColumn" aria-label="Second column"></div>
    </div>
  </section>

  <p id="result" aria-live="polite"></p>

  <script>
    // Edit these 10 pairs to create your own activity.
    const pairs = [
      ["Cat", "Kitten"],
      ["Dog", "Puppy"],
      ["Horse", "Foal"],
      ["Cow", "Calf"],
      ["Sheep", "Lamb"],
      ["Goat", "Kid"],
      ["Duck", "Duckling"],
      ["Chicken", "Chick"],
      ["Frog", "Tadpole"],
      ["Butterfly", "Caterpillar"]
    ];

    let player = "";
    let selectedLeft = null;
    let selectedRight = null;
    let score = 0;
    let completed = 0;
    let attempts = Array(pairs.length).fill(0);
    let locked = false;

    // Audio is created after the user interacts, as required by most browsers.
    let audioContext;

    function playTone(frequency, duration, type = "sine") {
      audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume();

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.18, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        0.001, audioContext.currentTime + duration
      );
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    }

    function playIncorrect() {
      playTone(180, 0.25, "square");
    }

    function playBell() {
      playTone(880, 0.45);
      setTimeout(() => playTone(1175, 0.5), 100);
    }

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    document.getElementById("nameForm").addEventListener("submit", event => {
      event.preventDefault();
      player = document.getElementById("playerName").value.trim();
      if (!player) return;

      document.getElementById("nameForm").style.display = "none";
      document.getElementById("game").style.display = "block";
      document.getElementById("welcome").textContent = `Selamat mencuba, ${player}!`;

      const leftItems = pairs.map((pair, index) => ({ text: pair[0], index }));
      const rightItems = shuffle(pairs.map((pair, index) => ({ text: pair[1], index })));

      renderColumn("leftColumn", leftItems, "left");
      renderColumn("rightColumn", rightItems, "right");
    });

    function renderColumn(containerId, items, side) {
      const container = document.getElementById(containerId);
      items.forEach(item => {
        const button = document.createElement("button");
        button.className = "item";
        button.textContent = item.text;
        button.dataset.index = item.index;
        button.addEventListener("click", () => selectItem(button, side));
        container.appendChild(button);
      });
    }

    function selectItem(button, side) {
      if (locked || button.disabled) return;

      const previous = side === "left" ? selectedLeft : selectedRight;
      if (previous) previous.classList.remove("selected");

      button.classList.add("selected");
      if (side === "left") selectedLeft = button;
      else selectedRight = button;

      if (selectedLeft && selectedRight) checkMatch();
    }

    function checkMatch() {
      locked = true;
      const leftIndex = Number(selectedLeft.dataset.index);
      const rightIndex = Number(selectedRight.dataset.index);

      if (leftIndex === rightIndex) {
        const points = attempts[leftIndex] === 0 ? 2 :
                       attempts[leftIndex] === 1 ? 1 : 0;
        attempts[leftIndex]++;
        score += points;
        completed++;

        selectedLeft.classList.add("matched");
        selectedRight.classList.add("matched");
        selectedLeft.disabled = true;
        selectedRight.disabled = true;

        playBell();
        document.getElementById("status").textContent =
          `Correct! +${points} point${points === 1 ? "" : "s"}. Score: ${score}`;

        selectedLeft = selectedRight = null;
        locked = false;

        if (completed === pairs.length) finishGame();
      } else {
        attempts[leftIndex]++;
        attempts[rightIndex]++;
        playIncorrect();
        document.getElementById("status").textContent = "Silap tu. Cuba lagi.";

        setTimeout(() => {
          selectedLeft?.classList.remove("selected");
          selectedRight?.classList.remove("selected");
          selectedLeft = selectedRight = null;
          locked = false;
        }, 650);
      }
    }

    function finishGame() {
      document.getElementById("status").textContent = "Selesailah sudah aktiviti ini.!";
      document.getElementById("result").textContent =
        `${player}, your final score is ${score} out of ${pairs.length * 2}.`;
    }
  </script>
</body>
</html>
